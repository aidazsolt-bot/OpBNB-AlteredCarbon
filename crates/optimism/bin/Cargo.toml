[package]
name = "op-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[dependencies]
# reth
reth-cli-util.workspace = true
reth-node-core.workspace = true

# optimism
reth-optimism-cli.workspace = true
reth-optimism-node.workspace = true

clap = { workspace = true, features = ["derive", "env"] }
tracing.workspace = true

[lints]
workspace = true

[features]
default = ["jemalloc"]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-optimism-cli/jemalloc",
    "reth-node-core/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "reth-cli-util/jemalloc-prof",
    "reth-optimism-cli/jemalloc-prof",
]
jemalloc-symbols = [
    "jemalloc-prof",
    "reth-optimism-cli/jemalloc-symbols",
]

otlp = ["reth-optimism-cli/otlp", "reth-node-core/otlp"]
tracy = ["reth-optimism-cli/tracy", "reth-node-core/tracy"]

asm-keccak = [
    "reth-optimism-cli/asm-keccak",
    "reth-optimism-node/asm-keccak",
    "reth-node-core/asm-keccak",
]
keccak-cache-global = [
    "reth-optimism-cli/keccak-cache-global",
    "reth-optimism-node/keccak-cache-global",
    "reth-node-core/keccak-cache-global",
]

js-tracer = ["reth-optimism-node/js-tracer"]
dev = ["reth-optimism-cli/dev"]

min-error-logs = ["tracing/release_max_level_error", "reth-node-core/min-error-logs"]
min-warn-logs = ["tracing/release_max_level_warn", "reth-node-core/min-warn-logs"]
min-info-logs = ["tracing/release_max_level_info", "reth-node-core/min-info-logs"]
min-debug-logs = ["tracing/release_max_level_debug", "reth-node-core/min-debug-logs"]
min-trace-logs = ["tracing/release_max_level_trace", "reth-node-core/min-trace-logs"]

[[bin]]
name = "op-reth"
path = "src/main.rs"
